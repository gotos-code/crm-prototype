<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>承認管理 — SO CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#EEECE4; --ink:#1E2430; --ink-soft:#5B6273; --border:#DEDAD0;
    --primary:#223A70; --ok:#2E7D6B; --ok-soft:#E3EFEA; --warn:#C77A1E; --warn-soft:#FBEBD6; --danger:#B23A2E; --danger-soft:#F7E1DD;
    --font: "Hiragino Maru Gothic ProN", "Kosugi Maru", -apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Segoe UI",Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171B22; --surface:#1E232C; --surface-2:#262C36; --ink:#E7E9ED; --ink-soft:#9AA2B1; --border:#333A46; --primary:#7C93C9; --ok:#5FAF9A; --ok-soft:#1E2E2A; --warn:#E0A857; --warn-soft:#3A2E1C; --danger:#E28A7C; --danger-soft:#3A2320; }
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;}
  .wrap{max-width:820px;margin:0 auto;padding:40px 24px 80px;}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  a.back{font-size:12.5px;color:var(--ink-soft);text-decoration:none;}
  a.back:hover{color:var(--primary);}
  .logout{font-size:12.5px;color:var(--primary);font-weight:700;background:none;border:none;cursor:pointer;padding:0;}
  h1{font-size:20px;margin:0 0 6px;}
  p.lead{color:var(--ink-soft);font-size:13px;margin:0 0 26px;}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  th{text-align:left;padding:10px 14px;background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:700;}
  td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:middle;}
  .pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:700;}
  .pill-ok{background:var(--ok-soft);color:var(--ok);}
  .pill-warn{background:var(--warn-soft);color:var(--warn);}
  .pill-admin{background:var(--primary);color:#fff;}
  .pill-neutral{background:var(--surface-2);color:var(--ink-soft);}
  button.act{font-family:var(--font);font-size:12px;font-weight:700;padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;margin-right:6px;}
  button.act:hover{background:var(--surface-2);}
  button.act.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .empty{color:var(--ink-soft);text-align:center;padding:40px 0;font-size:13px;}
  .denied{max-width:400px;margin:80px auto;text-align:center;}
  .denied h2{font-size:16px;}
  .denied p{color:var(--ink-soft);font-size:13px;}
  #authGate{position:fixed;inset:0;background:var(--bg);z-index:9999;}
</style>
</head>
<body>
<div id="authGate"></div>
<div class="wrap" id="mainWrap" style="display:none;">
  <div class="topline">
    <a class="back" href="index.html">← 一覧に戻る</a>
    <button class="logout" id="logoutBtn">ログアウト</button>
  </div>
  <h1>承認管理</h1>
  <p class="lead">サインアップしたアカウントの承認・管理者権限を設定します。</p>
  <table>
    <thead><tr><th>氏名</th><th>メールアドレス</th><th>状態</th><th>権限</th><th>登録日</th><th>操作</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div class="denied" id="denied" style="display:none;">
  <h2>このページを見る権限がありません</h2>
  <p>管理者アカウントのみアクセスできます。</p>
  <a class="back" href="index.html">← 一覧に戻る</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://qoaovyinizzwhfahcowz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HiBSZiuR9ZzHw67YloMvcw__vzYPm5S';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let myId = null;

  function fmtDate(iso){ return new Date(iso).toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}); }

  async function loadRows(){
    const { data: rows, error } = await client.from('profiles').select('id,email,approved,is_admin,created_at,last_name,first_name').order('created_at', {ascending:true});
    const tbody = document.getElementById('rows');
    if(error || !rows || rows.length===0){ tbody.innerHTML = '<tr><td colspan="6" class="empty">データがありません</td></tr>'; return; }
    tbody.innerHTML = rows.map(r=>{
      const statusPill = r.approved ? '<span class="pill pill-ok">承認済み</span>' : '<span class="pill pill-warn">承認待ち</span>';
      const rolePill = r.is_admin ? '<span class="pill pill-admin">管理者</span>' : '<span class="pill pill-neutral">一般</span>';
      const fullName = (r.last_name||r.first_name) ? (r.last_name||'')+' '+(r.first_name||'') : '—';
      const approveBtn = r.approved
        ? '<button class="act" data-action="unapprove" data-id="'+r.id+'">承認取消</button>'
        : '<button class="act primary" data-action="approve" data-id="'+r.id+'">承認する</button>';
      const adminBtn = r.is_admin
        ? '<button class="act" data-action="unadmin" data-id="'+r.id+'"'+(r.id===myId?' disabled title="自分自身の管理者権限は解除できません"':'')+'>管理者解除</button>'
        : '<button class="act" data-action="makeadmin" data-id="'+r.id+'">管理者にする</button>';
      return '<tr><td>'+fullName+'</td><td>'+r.email+'</td><td>'+statusPill+'</td><td>'+rolePill+'</td><td>'+fmtDate(r.created_at)+'</td><td>'+approveBtn+adminBtn+'</td></tr>';
    }).join('');
    tbody.querySelectorAll('button.act').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const patch = action==='approve' ? {approved:true} : action==='unapprove' ? {approved:false} : action==='makeadmin' ? {is_admin:true} : {is_admin:false};
        btn.disabled = true;
        await client.from('profiles').update(patch).eq('id', id);
        loadRows();
      });
    });
  }

  (async function(){
    const { data: sessionData } = await client.auth.getSession();
    if(!sessionData.session){ location.href = 'login.html'; return; }
    myId = sessionData.session.user.id;
    const { data: profile, error } = await client.from('profiles').select('is_admin,approved').eq('id', myId).single();
    document.getElementById('authGate').remove();
    if(error || !profile || !profile.approved || !profile.is_admin){
      document.getElementById('denied').style.display='block';
      return;
    }
    document.getElementById('mainWrap').style.display='block';
    loadRows();
  })();

  document.getElementById('logoutBtn').addEventListener('click', async ()=>{
    await client.auth.signOut();
    location.href = 'login.html';
  });
</script>
</body>
</html>
