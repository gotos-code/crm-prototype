<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SO CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  body{font-family:"M PLUS Rounded 1c",-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;background:#F5F4EF;color:#1E2430;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  #authGateContent{display:none;text-align:center;max-width:340px;padding:20px;}
  #authGateContent h2{font-size:16px;margin:0 0 10px;color:#1E2430;}
  #authGateContent p{font-size:13px;color:#5B6273;margin:0 0 18px;}
  #authGateLogout{font-family:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:6px;border:1px solid #223A70;background:#223A70;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div id="authGateContent">
  <h2>承認待ちです</h2>
  <p>管理者の承認が完了すると利用できるようになります。しばらくしてからもう一度お試しください。</p>
  <button id="authGateLogout">ログアウト</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://qoaovyinizzwhfahcowz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HiBSZiuR9ZzHw67YloMvcw__vzYPm5S';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  (async function(){
    const { data: sessionData } = await client.auth.getSession();
    if(!sessionData.session){ location.href = 'login.html'; return; }
    const uid = sessionData.session.user.id;
    const { data: profile, error } = await client.from('profiles').select('approved').eq('id', uid).single();
    if(error || !profile || !profile.approved){
      document.getElementById('authGateContent').style.display='block';
      document.getElementById('authGateLogout').addEventListener('click', async ()=>{ await client.auth.signOut(); location.href='login.html'; });
      return;
    }
    location.href = 'standard.html';
  })();
</script>
</body>
</html>
