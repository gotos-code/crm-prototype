<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SO CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --ink:#1E2430; --ink-soft:#5B6273; --border:#DEDAD0;
    --primary:#223A70; --sidebar-bg:#2E5AA8;
    --font: "Hiragino Maru Gothic ProN", "Kosugi Maru", -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Segoe UI", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171B22; --surface:#1E232C; --ink:#E7E9ED; --ink-soft:#9AA2B1; --border:#333A46; --primary:#4A6FB5; --sidebar-bg:#4A6FB5; }
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:var(--font);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;}
  #authGate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;}
  #authGateContent{display:none;text-align:center;max-width:340px;padding:20px;}
  #authGateContent h2{font-size:16px;margin:0 0 10px;}
  #authGateContent p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
  #authGateLogout{font-family:inherit;font-weight:700;font-size:13px;padding:9px 16px;border-radius:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;}
  .wrap{max-width:640px;width:100%;text-align:center;}
  .brand{font-weight:800;font-size:16px;color:var(--primary);margin-bottom:6px;}
  h1{font-size:20px;margin:0 0 8px;}
  .lead{font-size:13.5px;color:var(--ink-soft);margin:0 0 32px;}
  .cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;}
  .card{flex:1 1 240px;max-width:280px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 20px;text-decoration:none;color:var(--ink);transition:transform .12s ease,box-shadow .12s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);border-color:var(--primary);}
  .card .icon{font-size:34px;margin-bottom:12px;}
  .card .title{font-size:15.5px;font-weight:800;margin-bottom:6px;}
  .card .desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .foot{margin-top:34px;}
  #logoutBtn{font-family:inherit;font-size:12.5px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div id="authGate">
  <div id="authGateContent">
    <h2>承認待ちです</h2>
    <p>管理者の承認が完了すると利用できるようになります。しばらくしてからもう一度お試しください。</p>
    <button id="authGateLogout">ログアウト</button>
  </div>
</div>

<div class="wrap" id="mainContent" style="display:none;">
  <div class="brand">SO CRM</div>
  <h1>ご利用のツールを選択してください</h1>
  <p class="lead">どちらも入っている機能は同じです。今後、それぞれの用途に合わせて内容を分けていく予定です。</p>
  <div class="cards">
    <a class="card" href="standard.html">
      <div class="icon">🏢</div>
      <div class="title">既存顧客</div>
      <div class="desc">進行中の商談・案件を管理します</div>
    </a>
    <a class="card" href="dormant.html">
      <div class="icon">🌙</div>
      <div class="title">休眠顧客</div>
      <div class="desc">休眠中の顧客のフォローアップを管理します</div>
    </a>
  </div>
  <div class="foot"><button id="logoutBtn">ログアウト</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const client = window.supabase.createClient('https://qoaovyinizzwhfahcowz.supabase.co','sb_publishable_HiBSZiuR9ZzHw67YloMvcw__vzYPm5S');
  (async function(){
    const { data: sessionData } = await client.auth.getSession();
    if(!sessionData.session){ location.href = 'login.html'; return; }
    const uid = sessionData.session.user.id;
    const { data: profile, error } = await client.from('profiles').select('approved').eq('id', uid).single();
    if(error || !profile || !profile.approved){
      document.getElementById('authGateContent').style.display='block';
      document.getElementById('authGateLogout').addEventListener('click', async ()=>{ await client.auth.signOut(); location.href='login.html'; });
      return;
    }
    document.getElementById('authGate').remove();
    document.getElementById('mainContent').style.display='block';
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{ await client.auth.signOut(); location.href='login.html'; });
  })();
</script>
</body>
</html>
