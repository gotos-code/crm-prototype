<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ログイン — CRM プロトタイプ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --ink:#1E2430; --ink-soft:#5B6273;
    --border:#DEDAD0; --primary:#223A70; --danger:#B23A2E; --danger-soft:#F7E1DD;
    --ok:#2E7D6B; --ok-soft:#E3EFEA;
    --font: -apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Segoe UI",Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#171B22; --surface:#1E232C; --ink:#E7E9ED; --ink-soft:#9AA2B1; --border:#333A46; --primary:#7C93C9; --danger:#E28A7C; --danger-soft:#3A2320; --ok:#5FAF9A; --ok-soft:#1E2E2A; }
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--font);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:36px 34px;width:380px;max-width:92vw;}
  h1{font-size:17px;margin:0 0 6px;}
  p.lead{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input{width:100%;font-family:var(--font);font-size:14px;padding:10px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--ink);margin-bottom:12px;}
  button{width:100%;font-family:var(--font);font-weight:700;font-size:14px;padding:11px;border-radius:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;}
  button:hover{filter:brightness(1.08);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{display:none;font-size:12.5px;border-radius:6px;padding:9px 11px;margin-bottom:12px;}
  .msg.show{display:block;}
  .msg.error{background:var(--danger-soft);color:var(--danger);}
  .msg.ok{background:var(--ok-soft);color:var(--ok);}
  .switch{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:18px;}
  .switch a{color:var(--primary);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Nexus CRM ログイン</h1>
    <p class="lead">社内アカウントのメールアドレスとパスワードでログインしてください。</p>
    <div class="msg" id="msg"></div>
    <label for="email">メールアドレス</label>
    <input type="text" id="email" placeholder="you@sora1.jp" autocomplete="email" autofocus>
    <label for="password">パスワード</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <button type="submit" id="submitBtn">ログイン</button>
    <div class="switch">アカウントをお持ちでない方は <a href="signup.html">新規登録</a></div>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://qaoovyinizzwhfahcowz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_HiBSZiuR9ZzHw67YloMvcw__vzYPm5S';
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const msgBox = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('redirect') || 'index.html';

  function showMsg(text, kind){
    msgBox.textContent = text;
    msgBox.className = 'msg show ' + kind;
  }

  (async function(){
    const { data } = await client.auth.getSession();
    if(data.session){ location.href = redirectTo; }
  })();

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if(!email || !password){ showMsg('メールアドレスとパスワードを入力してください', 'error'); return; }
    submitBtn.disabled = true; submitBtn.textContent = 'ログイン中…';
    const { error } = await client.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false; submitBtn.textContent = 'ログイン';
    if(error){ showMsg('ログインに失敗しました：' + error.message, 'error'); return; }
    location.href = redirectTo;
  });
</script>
</body>
</html>
