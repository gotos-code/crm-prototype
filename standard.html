<title>CRM Sample A — スタンダード業務型</title>
<style>
  :root{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#EEECE4;
    --ink:#1E2430; --ink-soft:#5B6273; --border:#DEDAD0;
    --primary:#223A70; --primary-ink:#FFFFFF; --primary-soft:#E7EBF5;
    --accent:#2E7D6B; --accent-soft:#E3EFEA;
    --warn:#C77A1E; --warn-soft:#FBEBD6;
    --danger:#B23A2E; --danger-soft:#F7E1DD;
    --radius:6px;
    --font: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Segoe UI", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171B22; --surface:#1E232C; --surface-2:#262C36;
      --ink:#E7E9ED; --ink-soft:#9AA2B1; --border:#333A46;
      --primary:#7C93C9; --primary-ink:#141821; --primary-soft:#232B3D;
      --accent:#5FAF9A; --accent-soft:#1E2E2A;
      --warn:#E0A857; --warn-soft:#3A2E1C;
      --danger:#E28A7C; --danger-soft:#3A2320;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171B22; --surface:#1E232C; --surface-2:#262C36;
    --ink:#E7E9ED; --ink-soft:#9AA2B1; --border:#333A46;
    --primary:#7C93C9; --primary-ink:#141821; --primary-soft:#232B3D;
    --accent:#5FAF9A; --accent-soft:#1E2E2A;
    --warn:#E0A857; --warn-soft:#3A2E1C;
    --danger:#E28A7C; --danger-soft:#3A2320;
  }
  :root[data-theme="light"]{
    --bg:#F5F4EF; --surface:#FFFFFF; --surface-2:#EEECE4;
    --ink:#1E2430; --ink-soft:#5B6273; --border:#DEDAD0;
    --primary:#223A70; --primary-ink:#FFFFFF; --primary-soft:#E7EBF5;
    --accent:#2E7D6B; --accent-soft:#E3EFEA;
    --warn:#C77A1E; --warn-soft:#FBEBD6;
    --danger:#B23A2E; --danger-soft:#F7E1DD;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6;}
  .app{display:flex;min-height:100vh;}
  /* Sidebar */
  .sidebar{width:220px;flex:none;background:var(--primary);color:var(--primary-ink);display:flex;flex-direction:column;padding:20px 0;}
  .brand{padding:0 20px 20px;font-size:17px;font-weight:700;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:12px;}
  .brand small{display:block;font-weight:400;font-size:11px;opacity:.7;margin-top:2px;letter-spacing:.08em;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;opacity:.82;font-weight:500;border-left:3px solid transparent;}
  .nav-item:hover{opacity:1;background:rgba(255,255,255,.06);}
  .nav-item.active{opacity:1;background:rgba(255,255,255,.12);border-left-color:var(--accent);}
  .nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums;}
  .sidebar-foot{margin-top:auto;padding:16px 20px 0;font-size:11px;opacity:.55;}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);}
  .topbar h1{font-size:16px;margin:0;font-weight:700;}
  .user-switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  .user-switch select{font-family:var(--font);font-size:13px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--ink);}
  .content{padding:24px 28px;flex:1;overflow:auto;}
  /* Cards / tables */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .panel + .panel{margin-top:18px;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h2{font-size:14px;margin:0;font-weight:700;}
  .panel-body{padding:16px 18px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:9px 10px;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr.row:hover{background:var(--surface-2);cursor:pointer;}
  .table-scroll{overflow-x:auto;}
  .pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .pill-ok{background:var(--accent-soft);color:var(--accent);}
  .pill-warn{background:var(--warn-soft);color:var(--warn);}
  .pill-danger{background:var(--danger-soft);color:var(--danger);}
  .pill-neutral{background:var(--surface-2);color:var(--ink-soft);}
  .progress-bar{width:90px;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;}
  .progress-bar > i{display:block;height:100%;background:var(--accent);}
  .btn{font-family:var(--font);font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  input[type=text],input[type=date],input[type=number],select,textarea{
    width:100%;font-family:var(--font);font-size:13px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  label{display:block;font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .field{margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .search-bar{display:flex;gap:10px;margin-bottom:14px;}
  .search-bar input{max-width:280px;}
  /* Alert banner */
  .alert-banner{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:10px;font-size:13px;}
  .alert-banner strong{font-weight:700;}
  .alert-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .alert-chip{background:var(--surface);border:1px solid var(--danger);color:var(--danger);padding:3px 10px;border-radius:100px;font-size:12px;cursor:pointer;font-weight:600;}
  /* Modal / drawer */
  .overlay{position:fixed;inset:0;background:rgba(20,20,20,.4);display:none;align-items:stretch;justify-content:flex-end;z-index:50;}
  .overlay.open{display:flex;}
  .drawer{width:520px;max-width:92vw;background:var(--surface);height:100%;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.15);}
  .drawer-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2;}
  .drawer-head h2{margin:0;font-size:16px;}
  .drawer-body{padding:20px 22px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;}
  .subhead{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px;}
  .log-entry{border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;background:var(--bg);}
  .log-entry .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-soft);border-bottom:2px solid transparent;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  .view{display:none;}
  .view.active{display:block;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;padding:4px 0;}
  .cal-cell{min-height:88px;border:1px solid var(--border);border-radius:5px;padding:6px;background:var(--bg);font-size:12px;}
  .cal-cell.today{border-color:var(--primary);border-width:2px;}
  .cal-cell .d{font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
  .cal-item{background:var(--danger-soft);color:var(--danger);border-radius:4px;padding:2px 5px;margin-bottom:3px;font-size:11px;cursor:pointer;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cal-item.future{background:var(--primary-soft);color:var(--primary);}
  .cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .cal-nav h3{margin:0;font-size:15px;min-width:120px;}
  .export-row{display:flex;gap:10px;margin-bottom:14px;}
  .group-title{font-weight:700;font-size:13px;margin:18px 0 8px;padding:6px 10px;background:var(--surface-2);border-radius:5px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:20px 0;text-align:center;}
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .kcol-head{font-weight:700;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;color:var(--ink-soft);}
  .kcol-head .n{background:var(--surface-2);border-radius:100px;padding:1px 9px;font-size:11.5px;font-variant-numeric:tabular-nums;}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:12px;cursor:pointer;}
  .kcard:hover{background:var(--surface-2);}
  .kcard .cname{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .kcard .cind{font-size:11.5px;color:var(--ink-soft);margin-bottom:9px;}
  .kcard .bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-bottom:8px;}
  .kcard .bar i{display:block;height:100%;background:var(--primary);}
  .kcard .na{font-size:12px;margin-bottom:7px;}
  .kcard .meta-row{display:flex;justify-content:space-between;align-items:center;}
  .kcard .owner{font-size:11px;color:var(--ink-soft);}
  @media (max-width: 980px){.kanban{grid-template-columns:repeat(2,1fr);}}
</style>

<div class="app">
  <div class="sidebar">
    <div class="brand">Nexus CRM<small>SAMPLE A — スタンダード業務型</small></div>
    <div class="nav-item active" data-nav="list">📋 会社一覧</div>
    <div class="nav-item" data-nav="board">🗂 案件ボード</div>
    <div class="nav-item" data-nav="calendar">🗓 カレンダー</div>
    <div class="nav-item" data-nav="admin">📊 管理画面<span class="badge" id="navBadge" style="display:none;"></span></div>
    <div class="sidebar-foot">ログイン中の担当者で<br/>データを記録します。</div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">会社一覧</h1>
      <div class="user-switch">
        担当者:
        <select id="userSelect"></select>
      </div>
    </div>
    <div class="content">

      <!-- LIST VIEW -->
      <div class="view active" id="view-list">
        <div id="alertBanner"></div>
        <div class="search-bar">
          <input type="text" id="searchBox" placeholder="会社名・業種で検索">
        </div>
        <div class="panel">
          <div class="panel-head"><h2>取引先企業（<span id="companyCount">0</span>件）</h2></div>
          <div class="table-scroll">
            <table>
              <thead><tr>
                <th>会社名</th><th>業種</th><th>担当者</th><th>直近アプローチ日</th>
                <th>進捗率</th><th>ネクストアクション</th><th>ネクストアクション日</th>
              </tr></thead>
              <tbody id="companyTbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- BOARD VIEW -->
      <div class="view" id="view-board">
        <div class="search-bar">
          <input type="text" id="boardSearchBox" placeholder="会社名・業種で検索">
        </div>
        <div class="kanban" id="kanbanBoard"></div>
      </div>

      <!-- CALENDAR VIEW -->
      <div class="view" id="view-calendar">
        <div class="panel">
          <div class="panel-body">
            <div class="cal-nav">
              <button class="btn btn-sm" id="calPrev">← 前月</button>
              <h3 id="calLabel"></h3>
              <button class="btn btn-sm" id="calNext">翌月 →</button>
              <button class="btn btn-sm" id="calToday">今月</button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
          </div>
        </div>
      </div>

      <!-- ADMIN VIEW -->
      <div class="view" id="view-admin">
        <div class="tabs">
          <div class="tab active" data-tab="person">担当者ごと</div>
          <div class="tab" data-tab="deal">案件ごと</div>
          <div class="tab" data-tab="rate">進捗率ごと</div>
          <div class="tab" data-tab="nextdate">ネクストアクション日ごと</div>
        </div>
        <div class="export-row">
          <button class="btn btn-primary" id="exportBtn">⬇ CSVエクスポート（表示中のデータ）</button>
        </div>
        <div id="adminContent"></div>
      </div>

    </div>
  </div>
</div>

<!-- Detail Drawer -->
<div class="overlay" id="overlay">
  <div class="drawer">
    <div class="drawer-head">
      <h2 id="drawerTitle">会社名</h2>
      <button class="close-x" id="closeDrawer">✕</button>
    </div>
    <div class="drawer-body">
      <div class="subhead">新しい進捗を記録</div>
      <div class="grid2">
        <div class="field"><label>アプローチ日</label><input type="date" id="f_date"></div>
        <div class="field"><label>進捗率（%）</label><input type="number" id="f_rate" min="0" max="100" step="5"></div>
      </div>
      <div class="field"><label>進捗内容</label><textarea id="f_progress" placeholder="例）担当者と初回打合せ実施。要件をヒアリング。"></textarea></div>
      <div class="field"><label>提案内容</label><textarea id="f_proposal" placeholder="例）基本プラン＋オプションBを提案予定"></textarea></div>
      <div class="grid2">
        <div class="field"><label>ネクストアクション</label><input type="text" id="f_nextaction" placeholder="例）見積書を送付する"></div>
        <div class="field"><label>ネクストアクション日</label><input type="date" id="f_nextdate"></div>
      </div>
      <button class="btn btn-primary" id="saveLog" style="width:100%;">この内容で記録する</button>

      <div class="subhead">これまでの記録</div>
      <div id="logHistory"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORE_KEY = 'nexusCrmSampleA_v1';
  const USER_KEY = 'nexusCrmSampleA_user';
  const todayStr = () => new Date().toISOString().slice(0,10);

  const REPS = ['goto.s@sora1.jp','tanaka.m@sora1.jp','suzuki.k@sora1.jp','yamamoto.r@sora1.jp'];

  function seed(){
    const T = todayStr();
    const shift = n => { const d=new Date(T); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
    return [
      {id:1,name:'株式会社アオイ商事',industry:'商社',logs:[
        {date:shift(-20),owner:REPS[0],progress:20,progressText:'代表電話にて初回コンタクト。担当部署を確認。',proposal:'',nextAction:'資料一式を送付する',nextDate:shift(-15)},
        {date:shift(-10),owner:REPS[0],progress:45,progressText:'資料送付後、購買部の田中様と電話で要件確認。',proposal:'標準プラン＋導入サポートを提案',nextAction:'見積書を提出する',nextDate:shift(-2)},
      ]},
      {id:2,name:'田中精密工業株式会社',industry:'製造業',logs:[
        {date:shift(-30),owner:REPS[1],progress:60,progressText:'工場見学を実施。現場の課題をヒアリング。',proposal:'生産管理オプションを含むプランを提案',nextAction:'役員への提案プレゼンを実施する',nextDate:shift(0)},
      ]},
      {id:3,name:'未来フードサービス株式会社',industry:'飲食',logs:[
        {date:shift(-5),owner:REPS[2],progress:10,progressText:'展示会にて名刺交換。興味ありとの反応。',proposal:'',nextAction:'御礼メールとオンライン説明会の案内を送る',nextDate:shift(1)},
      ]},
      {id:4,name:'グリーンリーフ物流株式会社',industry:'物流',logs:[
        {date:shift(-40),owner:REPS[0],progress:80,progressText:'複数回の商談を経て稟議申請中との連絡あり。',proposal:'年間契約プラン（10%割引）を提示',nextAction:'稟議の進捗を確認する',nextDate:shift(3)},
      ]},
      {id:5,name:'ハヤシデザイン合同会社',industry:'デザイン',logs:[
        {date:shift(-8),owner:REPS[3],progress:30,progressText:'代表の林様とオンラインで初回面談。',proposal:'',nextAction:'トライアルアカウントを発行する',nextDate:shift(-1)},
      ]},
      {id:6,name:'桜井建設株式会社',industry:'建設',logs:[
        {date:shift(-60),owner:REPS[1],progress:100,progressText:'契約締結完了。導入作業に移行。',proposal:'導入済み',nextAction:'導入後1ヶ月フォローアップ',nextDate:shift(6)},
      ]},
      {id:7,name:'ノヴァテック株式会社',industry:'IT',logs:[
        {date:shift(-3),owner:REPS[2],progress:15,progressText:'問い合わせフォームより相談あり。折り返し予定。',proposal:'',nextAction:'電話でヒアリングを行う',nextDate:shift(0)},
      ]},
      {id:8,name:'さくらクリニックグループ',industry:'医療',logs:[
        {date:shift(-15),owner:REPS[0],progress:50,progressText:'複数拠点への導入について院長と協議。',proposal:'マルチ拠点プランを提案',nextAction:'拠点ごとの見積を再送する',nextDate:shift(-4)},
      ]},
      {id:9,name:'東西流通株式会社',industry:'流通',logs:[
        {date:shift(-25),owner:REPS[3],progress:70,progressText:'情報システム部と要件定義を実施。',proposal:'API連携オプション付きプラン',nextAction:'契約書ドラフトを送付する',nextDate:shift(2)},
      ]},
      {id:10,name:'ブルーウェーブITソリューションズ',industry:'IT',logs:[
        {date:shift(-2),owner:REPS[1],progress:5,progressText:'紹介経由で初回アプローチ。担当者不明。',proposal:'',nextAction:'担当者を特定し連絡する',nextDate:shift(4)},
      ]},
    ];
  }

  function load(){
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ try{ return JSON.parse(raw);}catch(e){} }
    const s = seed();
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
    return s;
  }
  function save(data){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

  let companies = load();
  let currentUser = localStorage.getItem(USER_KEY) || 'goto.s@sora1.jp';
  let activeCompanyId = null;
  let calDate = new Date();

  function latestLog(c){ return c.logs[c.logs.length-1]; }
  function daysDiff(dateStr){
    const d = new Date(dateStr+'T00:00:00');
    const t = new Date(todayStr()+'T00:00:00');
    return Math.round((d-t)/86400000);
  }
  function statusPill(dateStr){
    const diff = daysDiff(dateStr);
    if(diff < 0) return '<span class="pill pill-danger">期限超過 ('+Math.abs(diff)+'日)</span>';
    if(diff === 0) return '<span class="pill pill-warn">本日期限</span>';
    if(diff <= 3) return '<span class="pill pill-neutral">あと'+diff+'日</span>';
    return '<span class="pill pill-ok">'+dateStr+'</span>';
  }

  // ---- nav ----
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
      el.classList.add('active');
      const nav = el.dataset.nav;
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      document.getElementById('view-'+nav).classList.add('active');
      document.getElementById('pageTitle').textContent = {list:'会社一覧',board:'案件ボード',calendar:'カレンダー',admin:'管理画面'}[nav];
      if(nav==='board') renderBoard();
      if(nav==='calendar') renderCalendar();
      if(nav==='admin') renderAdmin();
    });
  });

  // ---- user switch ----
  const userSelect = document.getElementById('userSelect');
  REPS.forEach(r=>{
    const o=document.createElement('option'); o.value=r; o.textContent=r; userSelect.appendChild(o);
  });
  userSelect.value = currentUser;
  userSelect.addEventListener('change', ()=>{ currentUser = userSelect.value; localStorage.setItem(USER_KEY,currentUser); renderAdmin(); });

  // ---- alert banner ----
  function renderAlertBanner(){
    const overdue = companies.filter(c=>daysDiff(latestLog(c).nextDate) <= 0);
    const el = document.getElementById('alertBanner');
    if(overdue.length===0){ el.innerHTML=''; document.getElementById('navBadge').style.display='none'; return; }
    document.getElementById('navBadge').style.display='inline-block';
    document.getElementById('navBadge').textContent = overdue.length;
    el.innerHTML = '<div style="width:100%"><strong>⚠ ネクストアクション期限：'+overdue.length+'件が本日期限または期限超過です</strong>'+
      '<div class="alert-list">'+overdue.map(c=>'<span class="alert-chip" data-id="'+c.id+'">'+c.name+'（'+latestLog(c).nextDate+'）</span>').join('')+'</div></div>';
    el.className='alert-banner';
    el.querySelectorAll('.alert-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>openDrawer(parseInt(chip.dataset.id)));
    });
  }

  // ---- list ----
  function renderList(){
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const filtered = companies.filter(c=> c.name.toLowerCase().includes(q) || c.industry.toLowerCase().includes(q));
    document.getElementById('companyCount').textContent = filtered.length;
    const tbody = document.getElementById('companyTbody');
    tbody.innerHTML = filtered.map(c=>{
      const l = latestLog(c);
      return '<tr class="row" data-id="'+c.id+'">'+
        '<td><strong>'+c.name+'</strong></td>'+
        '<td>'+c.industry+'</td>'+
        '<td>'+l.owner.split('@')[0]+'</td>'+
        '<td>'+l.date+'</td>'+
        '<td><span class="progress-bar"><i style="width:'+l.progress+'%"></i></span>'+l.progress+'%</td>'+
        '<td>'+l.nextAction+'</td>'+
        '<td>'+statusPill(l.nextDate)+'</td>'+
        '</tr>';
    }).join('') || '<tr><td colspan="7" class="empty">該当する企業がありません</td></tr>';
    tbody.querySelectorAll('tr.row').forEach(tr=>{
      tr.addEventListener('click', ()=>openDrawer(parseInt(tr.dataset.id)));
    });
    renderAlertBanner();
  }
  document.getElementById('searchBox').addEventListener('input', renderList);

  // ---- board ----
  function renderBoard(){
    const q = document.getElementById('boardSearchBox').value.trim().toLowerCase();
    const filtered = companies.filter(c=> c.name.toLowerCase().includes(q) || c.industry.toLowerCase().includes(q));
    const buckets = [
      {label:'着手（0〜24%）', test:p=>p<25},
      {label:'商談中（25〜49%）', test:p=>p>=25&&p<50},
      {label:'提案・調整（50〜99%）', test:p=>p>=50&&p<100},
      {label:'成約（100%）', test:p=>p>=100},
    ];
    const kanban = document.getElementById('kanbanBoard');
    kanban.innerHTML = buckets.map(b=>{
      const items = filtered.filter(c=> b.test(latestLog(c).progress));
      return '<div class="kcol"><div class="kcol-head">'+b.label+'<span class="n">'+items.length+'</span></div>'+
        items.map(c=>{
          const l = latestLog(c);
          return '<div class="kcard" data-id="'+c.id+'">'+
            '<div class="cname">'+c.name+'</div><div class="cind">'+c.industry+'</div>'+
            '<div class="bar"><i style="width:'+l.progress+'%"></i></div>'+
            '<div class="na">▸ '+l.nextAction+'</div>'+
            '<div class="meta-row"><span class="owner">'+l.owner.split('@')[0]+'</span>'+statusPill(l.nextDate)+'</div>'+
            '</div>';
        }).join('') + (items.length===0?'<div class="empty" style="padding:12px;">なし</div>':'') +
        '</div>';
    }).join('');
    kanban.querySelectorAll('.kcard').forEach(card=>{
      card.addEventListener('click', ()=> openDrawer(parseInt(card.dataset.id)));
    });
  }
  document.getElementById('boardSearchBox').addEventListener('input', renderBoard);

  // ---- drawer ----
  function openDrawer(id){
    activeCompanyId = id;
    const c = companies.find(x=>x.id===id);
    document.getElementById('drawerTitle').textContent = c.name + '（'+c.industry+'）';
    document.getElementById('f_date').value = todayStr();
    document.getElementById('f_rate').value = latestLog(c).progress;
    document.getElementById('f_progress').value='';
    document.getElementById('f_proposal').value='';
    document.getElementById('f_nextaction').value='';
    document.getElementById('f_nextdate').value='';
    renderHistory(c);
    document.getElementById('overlay').classList.add('open');
  }
  function renderHistory(c){
    const el = document.getElementById('logHistory');
    el.innerHTML = c.logs.slice().reverse().map(l=>{
      return '<div class="log-entry"><div class="meta"><span>'+l.date+'　担当: '+l.owner.split('@')[0]+'</span><span>進捗率 '+l.progress+'%</span></div>'+
        '<div><strong>進捗内容：</strong>'+ (l.progressText||'—') +'</div>'+
        (l.proposal? '<div><strong>提案内容：</strong>'+l.proposal+'</div>':'')+
        '<div><strong>ネクストアクション：</strong>'+l.nextAction+'（'+l.nextDate+'）</div></div>';
    }).join('');
  }
  document.getElementById('closeDrawer').addEventListener('click', ()=>{
    document.getElementById('overlay').classList.remove('open');
    renderList();
  });
  document.getElementById('overlay').addEventListener('click', (e)=>{
    if(e.target.id==='overlay'){ document.getElementById('overlay').classList.remove('open'); renderList(); }
  });
  document.getElementById('saveLog').addEventListener('click', ()=>{
    const c = companies.find(x=>x.id===activeCompanyId);
    const date = document.getElementById('f_date').value || todayStr();
    const rate = parseInt(document.getElementById('f_rate').value||'0');
    const progressText = document.getElementById('f_progress').value.trim();
    const proposal = document.getElementById('f_proposal').value.trim();
    const nextAction = document.getElementById('f_nextaction').value.trim();
    const nextDate = document.getElementById('f_nextdate').value;
    if(!nextAction || !nextDate){ alert('ネクストアクションとネクストアクション日は必須です'); return; }
    c.logs.push({date,owner:currentUser,progress:rate,progressText,proposal,nextAction,nextDate});
    save(companies);
    renderHistory(c);
    document.getElementById('f_progress').value='';
    document.getElementById('f_proposal').value='';
    document.getElementById('f_nextaction').value='';
    document.getElementById('f_nextdate').value='';
  });

  // ---- calendar ----
  function renderCalendar(){
    const y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('calLabel').textContent = y+'年'+(m+1)+'月';
    const first = new Date(y,m,1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    const grid = document.getElementById('calGrid');
    grid.innerHTML='';
    ['日','月','火','水','木','金','土'].forEach(d=>{
      const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
    });
    for(let i=0;i<startDow;i++){ const el=document.createElement('div'); grid.appendChild(el); }
    const T = todayStr();
    for(let day=1; day<=daysInMonth; day++){
      const dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      const cell=document.createElement('div');
      cell.className='cal-cell'+(dateStr===T?' today':'');
      cell.innerHTML='<div class="d">'+day+'</div>';
      companies.forEach(c=>{
        const l = latestLog(c);
        if(l.nextDate===dateStr){
          const diff = daysDiff(l.nextDate);
          const item=document.createElement('div');
          item.className='cal-item'+(diff>0?' future':'');
          item.textContent=c.name;
          item.title=c.name+'：'+l.nextAction;
          item.addEventListener('click', ()=>{
            document.querySelector('.nav-item[data-nav="list"]').click();
            openDrawer(c.id);
          });
          cell.appendChild(item);
        }
      });
      grid.appendChild(cell);
    }
  }
  document.getElementById('calPrev').addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });
  document.getElementById('calToday').addEventListener('click', ()=>{ calDate = new Date(); renderCalendar(); });

  // ---- admin ----
  let adminTab = 'person';
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      adminTab = t.dataset.tab;
      renderAdmin();
    });
  });
  function adminRows(){
    return companies.map(c=>({c, l: latestLog(c)}));
  }
  function renderAdmin(){
    const rows = adminRows();
    const el = document.getElementById('adminContent');
    let groups = {};
    if(adminTab==='person'){
      rows.forEach(r=>{ (groups[r.l.owner] = groups[r.l.owner]||[]).push(r); });
    } else if(adminTab==='deal'){
      rows.forEach(r=>{ (groups[r.c.name] = groups[r.c.name]||[]).push(r); });
    } else if(adminTab==='rate'){
      const bucket = p => p>=100?'100%（成約）':p>=75?'75〜99%':p>=50?'50〜74%':p>=25?'25〜49%':'0〜24%';
      rows.forEach(r=>{ const k=bucket(r.l.progress); (groups[k]=groups[k]||[]).push(r); });
    } else {
      rows.sort((a,b)=> a.l.nextDate.localeCompare(b.l.nextDate));
      rows.forEach(r=>{ (groups[r.l.nextDate]=groups[r.l.nextDate]||[]).push(r); });
    }
    const keys = Object.keys(groups).sort();
    el.innerHTML = keys.map(k=>{
      const items = groups[k];
      return '<div class="group-title">'+k+'（'+items.length+'件）</div>'+
        '<div class="panel"><div class="table-scroll"><table><thead><tr>'+
        '<th>会社名</th><th>担当者</th><th>進捗率</th><th>ネクストアクション</th><th>ネクストアクション日</th>'+
        '</tr></thead><tbody>'+
        items.map(r=>'<tr><td>'+r.c.name+'</td><td>'+r.l.owner+'</td><td>'+r.l.progress+'%</td><td>'+r.l.nextAction+'</td><td>'+statusPill(r.l.nextDate)+'</td></tr>').join('')+
        '</tbody></table></div></div>';
    }).join('') || '<div class="empty">データがありません</div>';
  }
  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const rows = adminRows();
    const header = ['会社名','業種','担当者','アプローチ日','進捗内容','進捗率','提案内容','ネクストアクション','ネクストアクション日'];
    const csvRows = [header.join(',')];
    rows.forEach(r=>{
      const vals = [r.c.name, r.c.industry, r.l.owner, r.l.date, r.l.progressText, r.l.progress+'%', r.l.proposal, r.l.nextAction, r.l.nextDate]
        .map(v=> '"'+String(v||'').replace(/"/g,'""')+'"');
      csvRows.push(vals.join(','));
    });
    const blob = new Blob(['﻿'+csvRows.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'crm_export_'+todayStr()+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  renderList();
})();
</script>
